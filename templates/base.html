<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Rion's English Study Page{% endblock %}</title>
    <script>
        (function () {
            try {
                var saved = JSON.parse(localStorage.getItem("englishStudySettings") || "{}");
                if (saved.darkMode) {
                    document.documentElement.classList.add("dark-mode");
                }
            } catch (error) {}
        }());
    </script>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/select.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/study.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}" data-page="{% block page_key %}{% endblock %}">
    {% block body %}{% endblock %}
    <script src="{{ url_for('static', filename='js/core.js') }}"></script>
    <script src="{{ url_for('static', filename='js/select.js') }}"></script>
    <script src="{{ url_for('static', filename='js/study.js') }}"></script>
    <script src="{{ url_for('static', filename='js/navigation.js') }}"></script>
</body>
</html>
