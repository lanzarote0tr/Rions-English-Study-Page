<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>종이꽃 폭죽 — Div 주변 물리 이펙트</title>
  <style>
    :root {
      color-scheme: dark;
      --bg-1: #0c1227;
      --bg-2: #1a1744;
      --card: rgba(255,255,255,.10);
      --line: rgba(255,255,255,.16);
      --text: #f7f7ff;
      --muted: rgba(247,247,255,.72);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at 18% 15%, rgba(97, 83, 255, .44), transparent 34%),
        radial-gradient(circle at 84% 82%, rgba(255, 85, 157, .26), transparent 31%),
        linear-gradient(135deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }

    #confetti-canvas {
      position: fixed;
      inset: 0;
      z-index: 20;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .scene {
      width: min(920px, calc(100vw - 40px));
      padding: 28px;
      position: relative;
      z-index: 1;
      text-align: center;
    }

    .eyebrow {
      margin: 0 0 10px;
      font-size: .78rem;
      letter-spacing: .15em;
      color: var(--muted);
      font-weight: 700;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.6rem, 4vw, 3rem);
      letter-spacing: -.04em;
    }

    .sub {
      margin: 12px auto 26px;
      max-width: 600px;
      color: var(--muted);
      line-height: 1.6;
    }

    .box-wrap {
      position: relative;
      display: grid;
      place-items: center;
      min-height: 320px;
      isolation: isolate;
    }

    .box-wrap::before {
      content: "";
      position: absolute;
      width: min(580px, 88vw);
      height: 240px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(146, 106, 255, .19), transparent 68%);
      filter: blur(8px);
      z-index: -1;
    }

    .confetti-target {
      position: relative;
      width: min(430px, 84vw);
      min-height: 180px;
      border: 1px solid var(--line);
      border-radius: 26px;
      display: grid;
      place-items: center;
      padding: 24px;
      cursor: pointer;
      user-select: none;
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255,255,255,.16), rgba(255,255,255,.04)),
        rgba(16, 19, 53, .72);
      box-shadow:
        0 24px 65px rgba(0,0,0,.28),
        inset 0 1px 0 rgba(255,255,255,.18);
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .confetti-target:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow:
        0 30px 75px rgba(0,0,0,.35),
        0 0 0 1px rgba(255,255,255,.05),
        inset 0 1px 0 rgba(255,255,255,.22);
    }

    .confetti-target:active { transform: translateY(0) scale(.985); }

    .box-shine {
      position: absolute;
      width: 170px;
      height: 170px;
      border-radius: 50%;
      top: -85px;
      right: -62px;
      background: rgba(255,255,255,.12);
      filter: blur(4px);
    }

    .box-content { position: relative; }
    .box-content strong { display: block; font-size: clamp(1.35rem, 3vw, 2.05rem); }
    .box-content span { display: block; margin-top: 10px; color: var(--muted); font-size: .95rem; }

    .controls {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      padding: 11px 16px;
      color: var(--text);
      background: rgba(255,255,255,.10);
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: .18s ease;
    }
    button:hover { background: rgba(255,255,255,.18); transform: translateY(-2px); }
    button:active { transform: translateY(0); }
    button.primary {
      border-color: rgba(255,211,105,.55);
      color: #251c00;
      background: linear-gradient(135deg, #ffd66a, #ff9ebd);
    }

    code {
      display: inline-block;
      margin-top: 24px;
      color: rgba(255,255,255,.72);
      font-size: .82rem;
      background: rgba(0,0,0,.20);
      padding: 7px 10px;
      border-radius: 8px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; }
      .confetti-target, button { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="confetti-canvas" aria-hidden="true"></canvas>

  <main class="scene">
    <p class="eyebrow">PAPER FLOWER CONFETTI</p>
    <h1>Div 주변에서 터지는 종이꽃 폭죽</h1>
    <p class="sub">박스를 클릭하거나 아래 버튼을 누르면, 박스의 네 변을 따라 종이 조각이 튀어나와 중력과 회전 효과를 받으며 떨어집니다.</p>

    <div class="box-wrap">
      <!-- 다른 요소에도 class="confetti-target"만 붙이면 같은 방식으로 작동합니다. -->
      <div class="confetti-target" id="demo-box" tabindex="0" role="button" aria-label="종이꽃 폭죽 터뜨리기">
        <div class="box-shine"></div>
        <div class="box-content">
          <strong>여기를 클릭</strong>
          <span>이 div의 테두리 주변에서 폭죽이 터집니다</span>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="primary" id="burst-button">폭죽 터뜨리기</button>
      <button id="auto-button" aria-pressed="true">자동 폭죽: 켜짐</button>
    </div>
    <code>.confetti-target</code>
  </main>

  <script>
    (() => {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      const particles = [];
      const colors = ['#ff5f8f', '#ffb54b', '#ffe77b', '#70e2c7', '#7bb9ff', '#b68cff', '#ffffff'];
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      let dpr = Math.min(window.devicePixelRatio || 1, 2);
      let width = 0, height = 0;
      let last = performance.now();
      let auto = !reduceMotion;
      let nextAuto = performance.now() + 1300;

      function resize() {
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
        canvas.style.width = width + 'px';
        canvas.style.height = height + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      class Paper {
        constructor(x, y, options = {}) {
          const angle = options.angle ?? (Math.random() * Math.PI * 2);
          const speed = options.speed ?? (3.8 + Math.random() * 7.2);
          this.x = x;
          this.y = y;
          this.vx = Math.cos(angle) * speed + (Math.random() - .5) * 1.7;
          this.vy = Math.sin(angle) * speed - (1.3 + Math.random() * 1.4);
          this.w = 5 + Math.random() * 7;
          this.h = 8 + Math.random() * 11;
          this.rotation = Math.random() * Math.PI;
          this.spin = (Math.random() - .5) * .55;
          this.wobble = Math.random() * Math.PI * 2;
          this.wobbleSpeed = .08 + Math.random() * .15;
          this.color = colors[(Math.random() * colors.length) | 0];
          this.life = 0;
          this.maxLife = 165 + Math.random() * 105;
          this.alpha = 1;
        }

        update(dt) {
          const time = dt / 16.67;
          this.life += time;
          this.wobble += this.wobbleSpeed * time;
          this.vx += Math.sin(this.wobble) * .026 * time;
          this.vx *= Math.pow(.992, time);
          this.vy += .165 * time;              // gravity
          this.vy *= Math.pow(.998, time);
          this.x += this.vx * time;
          this.y += this.vy * time;
          this.rotation += this.spin * time;

          if (this.y + this.h > height - 2) {
            this.y = height - 2 - this.h;
            this.vy *= -.38;
            this.vx *= .72;
            this.spin *= .82;
          }
          if (this.x < -40 || this.x > width + 40 || this.life > this.maxLife) return false;
          this.alpha = Math.max(0, 1 - Math.max(0, this.life - this.maxLife * .72) / (this.maxLife * .28));
          return true;
        }

        draw() {
          ctx.save();
          ctx.translate(this.x, this.y);
          ctx.rotate(this.rotation + Math.sin(this.wobble) * .38);
          ctx.globalAlpha = this.alpha;
          ctx.fillStyle = this.color;
          ctx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
          ctx.globalAlpha = this.alpha * .28;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-this.w / 2, -this.h / 2, this.w, Math.max(1.2, this.h * .16));
          ctx.restore();
        }
      }

      function emitAround(el, amount = 180) {
        const r = el.getBoundingClientRect();
        const cx = r.left + r.width / 2;
        const cy = r.top + r.height / 2;
        const perimeter = 2 * (r.width + r.height);

        for (let i = 0; i < amount; i++) {
          const edge = Math.random() * perimeter;
          let x, y, nx, ny;
          if (edge < r.width) {
            x = r.left + edge; y = r.top; nx = 0; ny = -1;
          } else if (edge < r.width + r.height) {
            x = r.right; y = r.top + (edge - r.width); nx = 1; ny = 0;
          } else if (edge < 2 * r.width + r.height) {
            x = r.right - (edge - r.width - r.height); y = r.bottom; nx = 0; ny = 1;
          } else {
            x = r.left; y = r.bottom - (edge - 2 * r.width - r.height); nx = -1; ny = 0;
          }

          const dx = x - cx;
          const dy = y - cy;
          const len = Math.hypot(dx, dy) || 1;
          const outwardX = dx / len;
          const outwardY = dy / len;
          const direction = Math.atan2(outwardY * .65 + ny * .8, outwardX * .65 + nx * .8);
          particles.push(new Paper(x + nx * 6, y + ny * 6, {
            angle: direction + (Math.random() - .5) * 1.3,
            speed: 4.2 + Math.random() * 7.3
          }));
        }

        // center flower-like burst
        for (let i = 0; i < Math.floor(amount * .18); i++) {
          particles.push(new Paper(cx, cy, {
            angle: (Math.PI * 2 * i) / Math.floor(amount * .18) + (Math.random() - .5) * .22,
            speed: 2.8 + Math.random() * 5.2
          }));
        }
      }

      function frame(now) {
        const dt = Math.min(34, now - last);
        last = now;
        ctx.clearRect(0, 0, width, height);

        for (let i = particles.length - 1; i >= 0; i--) {
          if (!particles[i].update(dt)) particles.splice(i, 1);
          else particles[i].draw();
        }

        if (auto && now >= nextAuto) {
          document.querySelectorAll('.confetti-target').forEach(target => emitAround(target, 115));
          nextAuto = now + 2500 + Math.random() * 1000;
        }
        requestAnimationFrame(frame);
      }

      function burstAll(amount = 190) {
        document.querySelectorAll('.confetti-target').forEach(target => emitAround(target, amount));
      }

      document.querySelectorAll('.confetti-target').forEach(target => {
        target.addEventListener('click', () => emitAround(target));
        target.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            emitAround(target);
          }
        });
      });

      document.getElementById('burst-button').addEventListener('click', () => burstAll());
      document.getElementById('auto-button').addEventListener('click', e => {
        auto = !auto;
        e.currentTarget.textContent = `자동 폭죽: ${auto ? '켜짐' : '꺼짐'}`;
        e.currentTarget.setAttribute('aria-pressed', String(auto));
        if (auto) nextAuto = performance.now() + 250;
      });

      window.addEventListener('resize', resize, { passive: true });
      resize();
      requestAnimationFrame(frame);
      setTimeout(() => burstAll(150), 420);
    })();
  </script>
</body>
</html>
